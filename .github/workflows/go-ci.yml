name: go-ci

# Stub workflow created with T-00 (task list: "CI stub workflow").
# Covers the main Go module only; PoC modules under poc/ manage their own
# dependencies and are exercised by the Phase-0 ADR records. The Python CI
# gate stays in the GitCurator repo, untouched (09-testing-and-parity.md §7).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
